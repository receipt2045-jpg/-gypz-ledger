# Netlify 배포 설정 — moabuli (상업 이용 가능 호스팅)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 커스텀 도메인 루트에서 서비스하므로 base 경로는 "/"
  VITE_BASE = "/"
  # anon(publishable) 키는 공개되어도 안전 — 데이터 접근은 Supabase RLS가 통제
  VITE_SUPABASE_URL = "https://sygmpteafxlrhfbipkep.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_gGbVf_OUf8fmPRGoVdCYMw_UgHFbK16"

# SPA 폴백 (HashRouter라 필수는 아니지만, 직접 URL 접근 대비 안전망)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더
# frame-ancestors/X-Frame-Options: 다른 사이트가 앱을 투명 iframe으로 덮어
#   '회원 탈퇴' 같은 버튼을 대신 누르게 하는 클릭재킹을 막는다.
# connect-src: 실제로 호출하는 곳만 허용 (Supabase, 환율 API).
# style-src의 unsafe-inline: Tailwind가 인라인 스타일을 쓰므로 필요.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://sygmpteafxlrhfbipkep.supabase.co wss://sygmpteafxlrhfbipkep.supabase.co https://api.frankfurter.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), camera=(), payment=()"
